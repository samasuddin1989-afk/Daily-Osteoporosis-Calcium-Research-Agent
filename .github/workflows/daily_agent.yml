name: Daily Osteoporosis & Calcium Research Agent

on:
  schedule:
    # 10:10 UTC = 04:10 PM Bangladesh Standard Time (GMT+6)
    - cron: '10 16 * * *'
  workflow_dispatch: # Allows UNLIMITED manual runs anytime via the GitHub UI

jobs:
  run-agent:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Grants permission to update sent_history.json

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: pip install -r requirements.txt

      - name: Execute Research Agent
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          SENDER_EMAIL: ${{ secrets.SENDER_EMAIL }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          RECEIVER_EMAIL: ${{ secrets.RECEIVER_EMAIL }}
        run: python main.py

      - name: Commit and Push Updated Article History
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git pull --rebase origin main || true
          git add sent_history.json
          # [skip ci] prevents GitHub Actions from triggering a duplicate run on this commit
          git commit -m "Auto-update sent article history [skip ci]" || echo "No history changes to commit"
          git push origin main
